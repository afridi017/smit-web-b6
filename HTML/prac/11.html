    <h2>3. YouTube Video with Iframe</h2>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      frameborder="0"
      allowfullscreen

    <video
      src="Bol Kaffara (Lofi Mix).mp4"
      controls
      width="300"
      height="200"
      muted
      loop
      poster="video-poster.jpg"
    ></video>
