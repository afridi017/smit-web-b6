<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic Tags</title>
  </head>
  <body>
    <main style="border: 1px solid black; padding: 20px">
      <section>
        <article style="border: 1px solid black; margin: 10px; padding: 10px">
          I am IB Afridi and I am a student of computer science. I am learning
          HTML, CSS and JavaScript.
        </article>
      </section>

      <p>
        I am <span style="color: red; font-size: 20px">IB Afridi</span> and I am
        a student of computer science. I am learning
        <span style="color: blue; font-size: 20px"
          >HTML, CSS and JavaScript</span
        >.
      </p>
    </main>
  </body>
</html>
