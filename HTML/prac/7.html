<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Table</title>
    <style>
      table,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
        padding: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Time Table</h1>
    <table>
      <thead>
        <tr>
          <th>Days</th>
          <th>8:00 to 9:00</th>
          <th>9:00 to 10:00</th>
          <th>10:00 to 11:00</th>
          <th>11:00 to 12:00</th>
          <th>12:00 to 1:00</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Monday</th>
          <td>English</td>
          <td colspan="2">Maths</td>
          <td rowspan="4">Break</td>
          <td>Urdu</td>
        </tr>
        <tr>
          <th>Tuesday</th>
          <td rowspan="4">Maths</td>
          <td>English</td>
          <td>Urdu</td>
          <td>Bio</td>
        </tr>
        <tr>
          <th>Wednesday</th>
          <td>Urdu</td>
          <td>Bio</td>
          <td>English</td>
        </tr>
        <tr>
          <th>Thursday</th>
          <td>English</td>
          <td>Bio</td>
          <td>Urdu</td>
        </tr>
        <tr>
          <th>Friday</th>
          <td>English</td>
          <td>Urdu</td>
          <td>Bio</td>
          <td>Free</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
