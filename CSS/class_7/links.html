<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link in CSS</title>
    <style>
      /* LInks: it have three states: link, visited, hover */
      /* Link, visited, active, hover */
      /* default link color: blue */
      /* default visited color: purple */
      /* default active link color: red */

      .google-link {
        color: blue;
        text-decoration: none;
        border: 1px solid;
        padding: 5px;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
      }
      .facebook:link {
        color: rgba(0, 0, 0, 0.3);
        text-decoration: none;
      }
      .facebook:active {
        color: red;
      }
      .linkedin:visited {
        color: green;
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
        border-radius: 5px;
      }
      .google:hover {
        box-shadow: none;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <a class="google" href="https://www.google.com" target="_blank">Google</a>
    <a class="facebook" href="https://www.facebook.com" target="_blank"
      >Facebook</a
    >
    <a class="linkedin" href="https://www.linkedin.com" target="_blank">
      LinkedIn
    </a>
  </body>
</html>
