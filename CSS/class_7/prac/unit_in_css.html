<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Units</title>
    <style>
      html {
        font-size: 16px; /* 1rem = 16px */
      }
      body {
        font-family: Arial;
        padding: 20px;
        background: #f5f5f5;
      }

      .container {
        border: 2px solid black;
        height: auto;
        width: 50%; /* parent ka 50% */
        /* width: 50vw; */ /* screen ka 50% */
        padding: 20px;
        background: white;
        margin-bottom: 20px;
      }

      .para {
        /* font-size: 16px; */ /* Absolute */
        /* font-size: 1rem; */ /* 1 * 16px = 16px */
        font-size: 2rem; /* 2 * 16px = 32px */
        color: #1e293b;
      }

      .box-em {
        font-size: 20px; /* parent */
        border: 1px dashed blue;
        padding: 10px;
        margin-top: 20px;
        background: #dbeafe;
      }
      .box-em p {
        font-size: 1.5em; /* 1.5 * 20px = 30px */
      }

      .vh-box {
        height: 50vh; /* screen ki height ka 50% */
        background: #fef3c7;
        border: 2px solid #f59e0b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>CSS Units</h1>

    <div class="container">
      <p class="para">This is a paragraph with 2rem font size = 32px</p>
    </div>

    <div class="box-em">
      Parent font 20px
      <p>Ye 1.5em hai = 30px</p>
    </div>

    <div class="vh-box">Ye box screen ki 50% height lega - vh unit</div>
  </body>
</html>
