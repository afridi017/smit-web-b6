<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links in CSS</title>
    <style>
      body {
        font-family: Arial;
        padding: 30px;
        display: flex;
        gap: 20px;
      }

      /* LInks: 4 states hote hain - Yaad rakh: LVHA */
      /* L = :link, V = :visited, H = :hover, A = :active */

      /* 1. GOOGLE LINK */
      .google {
        color: #1a73e8;
        text-decoration: none;
        border: 2px solid #1a73e8;
        padding: 10px 20px;
        border-radius: 5px;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        transition: 0.3s;
      }
      .google:link {
        color: #1a73e8;
      } /* default */
      .google:visited {
        color: purple;
      } /* visit karne ke baad */
      .google:hover {
        /* mouse le jao */
        box-shadow: none;
        background: #1a73e8;
        color: white;
        border-radius: 10px;
      }
      .google:active {
        /* click karte waqt */
        color: red;
      }

      /* 2. FACEBOOK LINK */
      .facebook {
        color: #1877f2;
        text-decoration: none;
        padding: 10px 20px;
        border: 2px solid #1877f2;
        border-radius: 5px;
      }
      .facebook:hover {
        background: #1877f2;
        color: white;
      }
      .facebook:active {
        color: red;
      }

      /* 3. LINKEDIN LINK */
      .linkedin {
        color: #0a66c2;
        text-decoration: none;
        padding: 10px 20px;
        border: 2px solid #0a66c2;
        border-radius: 5px;
      }
      .linkedin:visited {
        color: green;
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
      }
      .linkedin:hover {
        background: #0a66c2;
        color: white;
      }
    </style>
  </head>
  <body>
    <a class="google" href="https://www.google.com" target="_blank">Google</a>
    <a class="facebook" href="https://www.facebook.com" target="_blank"
      >Facebook</a
    >
    <a class="linkedin" href="https://www.linkedin.com" target="_blank"
      >LinkedIn</a
    >
  </body>
</html>
