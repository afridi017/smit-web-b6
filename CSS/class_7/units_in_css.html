<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Units</title>
    <style>
      /*Unit in CSS */
      /* Two types of units: Absolute and Relative */
      /* Absolute units: px, cm, mm, in, pt, pc */
      /* Relative units: em, rem, %, vw, vh, vmin, vmax */

      /* rem: root element (work with root element font size) */
      /* 1rem::after 16px (default font size) */
      /* em: element (work with parent element font size) */
      .container {
        border: 1px solid black;
        /*height: 100px;*/
        height: auto;
        /* Fixed width */
        /* width: 200px;*/
        /* Relative width */
        /* width: 50%;*/
        /* width: 50vw;*/
        /* font-size: 16px;*/
      }
      html {
        font-size: 16px;
      }
      .para {
        /* font-size: 16px;*/
        /* font-size: 1rem;*/
        /* font-size: 1.5rem;*/
        font-size: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="para">This is a paragraph with a relative font size.</p>
    </div>
  </body>
</html>
