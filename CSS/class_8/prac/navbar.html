<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
    <!-- Material Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Roboto", sans-serif;
      }
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #333;
        padding: 15px 30px;
        color: white;
      }
      .logo {
        font-size: 24px;
        font-weight: bold;
        color: #fff;
      }
      ul {
        list-style: none;
        display: flex;
        margin: 0;
        padding: 0;
      }
      li {
        border: 1px solid #fff;
        margin: 0 10px;
        display: flex;
        padding: 8px 15px;
        border-radius: 5px;
        transition: 0.3s;
      }
      li > a {
        text-decoration: none; /* dashed nahi hota */
        color: #fff;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      li:hover {
        background-color: #555;
        cursor: pointer;
      }
      .nav-links a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
        font-weight: 500;
      }
      .nav-links a:hover {
        text-decoration: underline;
      }
      .material-symbols-outlined {
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">My Logo</div>

      <ul>
        <li>
          <a href="#" class="link">
            <span class="material-symbols-outlined">home</span>
            Home
          </a>
        </li>
        <li>
          <a href="#" class="link">
            <span class="material-symbols-outlined">info</span>
            About
          </a>
        </li>
        <li>
          <a href="#" class="link">
            <span class="material-symbols-outlined">delete</span>
            Delete
          </a>
        </li>
      </ul>

      <div class="nav-links">
        <a href="#">Contact</a>
        <a href="#">Login</a>
      </div>
    </nav>
  </body>
</html>
