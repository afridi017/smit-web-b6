<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS CLASS</title>
    <link rel="stylesheet" href="class-one.css" />
    <link rel="stylesheet" href="class-one2.css" />
  </head>
  <style>
    /* h2: selector */
    /* {}: declaration block */
    /* property_name: property_value;: property */
    h2 {
      color: blue;
    }
  </style>
  <body>
    <!-- inline Css -->
    <!-- internal Css -->
    <!-- external Css -->

    <!-- inline Css -->
    <!-- use style Attribute for inline Css -->
    <p
      style="
        color: red;
        font-size: 20px;
        font-weight: bold;
        border: 2px solid black;
        padding: 10px;
        margin: 20px;
      "
    >
      This is a paragraph with inline CSS.
    </p>
    <!-- internal Css -->
    <!-- use style tag for internal Css -->
    <h2
      style="
        color: green;
        font-size: 24px;
        font-weight: bold;
        border: 2px solid black;
        padding: 10px;
        margin: 20px;
      "
    >
      This is a paragraph with internal CSS.
    </h2>
    <h2>This is a paragraph with external CSS.</h2>
    <h2>IB AFRIDI</h2>
    <div class="">is a paragraph with external CSS.</div>
  </body>
</html>
