<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <style>
      table {
        border: 1px solid black;
        width: 50%;
        height: 80vh;
        border-collapse: collapse;
        /* border-collapse: separate; */
      }

      th,
      td {
        /* border: 1px solid black; */
        /* height: 40px;
            width: 100px; */
        padding: 10px;
        text-align: center;
      }
      th {
        /* text-align: left; */
        color: white;
        background-color: black;
      }
      tr {
        border-bottom: 1px solid;
      }

      /* td:hover {
        color: white;
         background-color: black;
      } */

      /* tr:hover {
        color: white;
        background-color: black;
      } */

      tr:nth-child(even) {
        background-color: lightgray;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>John Doe</td>
          <td>john@example.com</td>
          <td>123-456-7890</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Jane Smith</td>
          <td>jane@example.com</td>
          <td>234-567-8901</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Bob Johnson</td>
          <td>bob@example.com</td>
          <td>345-678-9012</td>
        </tr>
        <tr>
          <td>4</td>
          <td>Alice Brown</td>
          <td>alice@example.com</td>
          <td>456-789-0123</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
