<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .container {
        display: grid;
        height: 100vh;
        grid-template-columns: 50px 220px 1fr 1fr;
        grid-template-rows: 35px 1fr;
        gap: 2px;
        background: #000;
      }
      .a {
        grid-column: 1/2;
        grid-row: 1/3;
        background: #333;
      }
      .b {
        grid-column: 2/5;
        grid-row: 1/2;
        background: #2d2d2d;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
      }
      .c {
        grid-column: 2/3;
        grid-row: 2/3;
        background: #252526;
      }
      .d {
        grid-column: 3/5;
        grid-row: 2/3;
        background: #1e1e1e;
      }
      .b div {
        border-right: 1px solid #000;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="a"></div>
      <div class="b">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div class="c"></div>
      <div class="d"></div>
    </div>
  </body>
</html>
