<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: #f0f2f5;
        padding: 20px;
      }

      .dashboard {
        display: grid;
        grid-template-columns: 220px 1fr;
        grid-template-rows: 70px 1fr;
        grid-template-areas:
          "navbar navbar"
          "sidebar main";
        gap: 15px;
        height: 90vh;
      }

      /* Navbar */
      .navbar {
        grid-area: navbar;
        background: white;
        border-radius: 12px;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .logo {
        width: 120px;
        height: 35px;
        background: #e0e0e0;
        border-radius: 8px;
      }
      .nav-btns {
        display: flex;
        gap: 10px;
      }
      .nav-btns div {
        width: 60px;
        height: 30px;
        background: #e0e0e0;
        border-radius: 6px;
      }
      .profile {
        width: 35px;
        height: 35px;
        background: #e0e0e0;
        border-radius: 50%;
      }

      /* Sidebar */
      .sidebar {
        grid-area: sidebar;
        background: white;
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .menu-item {
        height: 40px;
        background: #e0e0e0;
        border-radius: 8px;
      }
      .logout {
        margin-top: auto;
        height: 40px;
        background: #ffdddd;
        border-radius: 8px;
      }

      /* Main Content */
      .main {
        grid-area: main;
        display: grid;
        grid-template-columns: 2fr 1fr;
        grid-template-rows: 120px 1fr;
        gap: 15px;
      }

      .cards-top {
        grid-column: 1 / 3;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
      .card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .big-left {
        grid-row: 2;
        grid-column: 1;
      }
      .big-right {
        grid-row: 2;
        grid-column: 2;
      }
    </style>
  </head>
  <body>
    <h2 style="margin-bottom: 15px">Dashboard</h2>

    <div class="dashboard">
      <!-- Navbar -->
      <div class="navbar">
        <div class="logo"></div>
        <div class="nav-btns">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
        <div class="profile"></div>
      </div>

      <!-- Sidebar -->
      <div class="sidebar">
        <div class="menu-item"></div>
        <div class="menu-item"></div>
        <div class="menu-item"></div>
        <div class="menu-item"></div>
        <div class="logout"></div>
      </div>

      <!-- Main -->
      <div class="main">
        <div class="cards-top">
          <div class="card"></div>
          <div class="card"></div>
          <div class="card"></div>
        </div>
        <div class="card big-left"></div>
        <div class="card big-right"></div>
      </div>
    </div>
  </body>
</html>
