<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition</title>
    <style>
      .container {
        width: 100px;
        height: 100px;
        border: 1px solid;
        margin: auto;
        transition-property: all;
        transition-duration: 1s;
        transition-delay: 2s;
      }
      .container:hover {
        transform: scale(1.5);
        transform: translate(500px);
      }
    </style>
  </head>
  <body>
    <div class="container"></div>
  </body>
</html>
